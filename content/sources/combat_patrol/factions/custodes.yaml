# ─── Faction Ability: Martial Ka'tah ───────────────────────────────────────────
faction_ability:
  name: "Martial Ka'tah"
  description: >-
    Each time a unit with this ability is selected to fight, choose one of the
    following stances. The selected stance is active until that unit finishes
    making its attacks.
  ability_type: FactionAbility
  effects:
    - StanceChoice:
        stances:
          - name: "Dacatarai"
            effects:
              - GrantWeaponAbility:
                  weapon_ability:
                    SustainedHits: 1
                  weapon_filter: MeleeOnly
            description: "Melee weapons have [SUSTAINED HITS 1]."
          - name: "Rendax"
            effects:
              - GrantWeaponAbility:
                  weapon_ability: LethalHits
                  weapon_filter: MeleeOnly
            description: "Melee weapons have [LETHAL HITS]."
  trigger: OnSelectedToFight

