# ─── Stratagems ────────────────────────────────────────────────────────────────
stratagems:
  # ── The Gilded Spear ─────────────────────────────────────────────────────────
  - name: "The Gilded Spear"
    cp_cost: 1
    phase: Fight
    timing: DuringPhase
    stratagem_type: BattleTactic
    target_restriction:
      required_keywords:
        - AdeptusCustodes
      excluded_keywords: []
      owner: Friendly
      conditions:
        - HasNotFoughtThisPhase
    effects:
      - ApplyForDuration:
          effect:
            TriggerMoveReaction:
              move_type: PileIn
              distance:
                Fixed: 6000
          duration: UntilEndOfPhase
    once_per_battle: false
    once_per_turn: true
    description: >-
      Until the end of the phase, each time a model in your unit makes a Pile-in
      move, it can move up to 6" instead of up to 3".

  # ── Inescapable Vengeance ────────────────────────────────────────────────────
  - name: "Inescapable Vengeance"
    cp_cost: 1
    phase: Movement
    timing: DuringPhase
    stratagem_type: StrategicPloy
    target_restriction:
      required_keywords:
        - AdeptusCustodes
      excluded_keywords: []
      owner: Friendly
      conditions:
        - HasNotMovedThisPhase
    effects:
      - ApplyForDuration:
          effect:
            AddModifier:
              target: Self_
              stat: AdvanceRoll
              value: 2
          duration: UntilEndOfPhase
    once_per_battle: false
    once_per_turn: true
    description: >-
      Until the end of the phase, add 2 to Advance rolls made for your unit.

  # ── Overawing Magnificence ───────────────────────────────────────────────────
  - name: "Overawing Magnificence"
    cp_cost: 1
    phase: Charge
    timing: AfterChargeDeclaration
    stratagem_type: BattleTactic
    target_restriction:
      required_keywords:
        - AdeptusCustodes
      excluded_keywords: []
      owner: Friendly
      conditions:
        - WasChargeTarget
    effects:
      - ForceLeadershipTest:
          target: SelectedEnemy
          on_fail:
            ApplyForDuration:
              effect:
                AddModifier:
                  target: Target
                  stat: ChargeRoll
                  value: -2
              duration: UntilEndOfPhase
    once_per_battle: false
    once_per_turn: true
    description: >-
      That enemy unit must take a Leadership test. If that test is failed, until
      the end of the phase, subtract 2 from Charge rolls made for that enemy unit.

# ─── Enhancements ─────────────────────────────────────────────────────────────
enhancements:
  # ── Watchman of Terra (default) ──────────────────────────────────────────────
  - name: "Watchman of Terra"
    description: >-
      While the bearer is within Engagement Range of one or more enemy units,
      its Objective Control characteristic is 4.
    is_default: true
    effects:
      - Conditional:
          condition: InEngagementRange
          effect:
            AlterOC:
              target: Bearer
              new_oc:
                SetTo: 4
          else_effect: null
    conditions:
      - InEngagementRange

  # ── Warrior Exemplar (optional) ──────────────────────────────────────────────
  - name: "Warrior Exemplar"
    description: >-
      Each time the bearer destroys an enemy unit, roll one D6. On a 3+, you
      gain 1CP.
    is_default: false
    effects:
      - DiceCheck:
          threshold: 3
          on_success:
            AlterCP:
              amount: 1
          on_failure: null
          modifier: 0
    conditions: []

# ─── Secondary Objectives ─────────────────────────────────────────────────────
secondary_objectives:
  # ── Raise the Vexillas (default) ─────────────────────────────────────────────
  - name: "Raise the Vexillas"
    description: >-
      From battle round 3 onwards, at the end of your turn, score 3VP if you
      control both the objective marker closest to your battlefield edge and the
      objective marker closest to your opponent's battlefield edge.
    is_default: true
    scoring:
      - timing:
          phase: Fight
          whose_turn: Active
          from_round: 3
        condition:
          All:
            - ControlsClosestObjective: OwnEdge
            - ControlsClosestObjective: OpponentEdge
        vp_amount: 3
        description: "Score 3VP if you control both edge objectives."
    max_vp: 9

  # ── Consecrated Ground (optional) ───────────────────────────────────────────
  - name: "Consecrated Ground"
    description: >-
      Each time an enemy unit is destroyed, score 3VP. Each time an Adeptus
      Custodes model is destroyed, lose 1VP. Minimum 0VP total.
    is_default: false
    scoring:
      - timing:
          phase: Fight
          whose_turn: Either
          from_round: 1
        condition:
          HasKeyword: AdeptusCustodes
        vp_amount: -1
        description: "Lose 1VP each time an Adeptus Custodes model is destroyed."
      - timing:
          phase: Fight
          whose_turn: Either
          from_round: 1
        condition:
          Not:
            HasKeyword: AdeptusCustodes
        vp_amount: 3
        description: "Score 3VP each time an enemy unit is destroyed."
    max_vp: null
