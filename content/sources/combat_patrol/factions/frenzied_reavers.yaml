# ─── Stratagems ────────────────────────────────────────────────────────────────
stratagems:
  # ── Horrifying Butchery ──────────────────────────────────────────────────────
  - name: "Horrifying Butchery"
    cp_cost: 1
    phase: Fight
    timing: StartOfPhase
    stratagem_type: BattleTactic
    target_restriction:
      required_keywords:
        - Berzerkers
      excluded_keywords: []
      owner: Friendly
      conditions: []
    effects:
      - ForceBattleShockTest:
          target: SelectedEnemy
    once_per_battle: false
    once_per_turn: true
    description: >-
      Select one enemy unit within Engagement Range of your unit. That enemy
      unit must take a Battle-shock test.

  # ── Berserk Resilience ───────────────────────────────────────────────────────
  - name: "Berserk Resilience"
    cp_cost: 1
    phase: Fight
    timing: AfterTargetSelection
    stratagem_type: BattleTactic
    target_restriction:
      required_keywords:
        - WorldEaters
        - Character
      excluded_keywords: []
      owner: Friendly
      conditions: []
    effects:
      - ApplyForDuration:
          effect:
            FightOnDeath:
              threshold: 4
              modifier_source: "Total Carnage"
          duration: UntilEndOfPhase
    once_per_battle: false
    once_per_turn: true
    description: >-
      Until the end of the phase, each time a model in your unit is destroyed,
      if that model has not fought this phase, roll one D6, adding 2 if the
      Total Carnage Blessing of Khorne is active for your army. On a 4+, do not
      remove the destroyed model from play; it can fight after the attacking
      unit has finished making its attacks, and is then removed from play.

  # ── Bloodlust ────────────────────────────────────────────────────────────────
  - name: "Bloodlust"
    cp_cost: 1
    phase: Shooting
    timing: AfterEnemyShoots
    stratagem_type: StrategicPloy
    target_restriction:
      required_keywords:
        - Jakhals
      excluded_keywords: []
      owner: Friendly
      conditions: []
    effects:
      - TriggerMoveReaction:
          move_type: NormalMove
          distance: D6
    once_per_battle: false
    once_per_turn: true
    description: >-
      Your unit can make a Normal move of up to D6".

# ─── Enhancements ─────────────────────────────────────────────────────────────
enhancements:
  # ── Fearsome Presence (default) ──────────────────────────────────────────────
  - name: "Fearsome Presence"
    description: >-
      While the bearer is not Battle-shocked, it has an Objective Control
      characteristic of 5.
    is_default: true
    effects:
      - Conditional:
          condition: NotBattleShocked
          effect:
            AlterOC:
              target: Bearer
              new_oc:
                SetTo: 5
          else_effect: null
    conditions:
      - NotBattleShocked

  # ── Bane of the Craven (optional) ───────────────────────────────────────────
  - name: "Bane of the Craven"
    description: >-
      Each time an enemy unit (excluding MONSTERS and VEHICLES) that is within
      Engagement Range of the bearer Falls Back, all models in that enemy unit
      must take a Desperate Escape test. When doing so, if that enemy unit is
      Battle-shocked, subtract 1 from each of those tests.
    is_default: false
    effects:
      - ForceDespairEscapeTest:
          modifier: 0
          condition:
            TargetNotMonsterOrVehicle
      - Conditional:
          condition: BattleShocked
          effect:
            ForceDespairEscapeTest:
              modifier: -1
              condition:
                TargetNotMonsterOrVehicle
          else_effect: null
    conditions: []

# ─── Secondary Objectives ─────────────────────────────────────────────────────
secondary_objectives:
  # ── Champions of Khorne (default) ───────────────────────────────────────────
  - name: "Champions of Khorne"
    description: >-
      From the second battle round onwards, at the end of your Command phase:
      score 2VP if there is one objective marker wholly within No Man's Land
      that you control and has one or more CHARACTER models (excluding
      Battle-shocked) within range; score 3VP instead if there are two such
      objective markers.
    is_default: true
    scoring:
      - timing:
          phase: Command
          whose_turn: Active
          from_round: 2
        condition:
          ObjectiveCount:
            condition:
              All:
                - OnObjectiveInNoMansLand
                - IsCharacter
                - NotBattleShocked
            count: 1
        vp_amount: 2
        description: "Score 2VP for 1 NML objective controlled with a non-Battle-shocked CHARACTER."
      - timing:
          phase: Command
          whose_turn: Active
          from_round: 2
        condition:
          ObjectiveCount:
            condition:
              All:
                - OnObjectiveInNoMansLand
                - IsCharacter
                - NotBattleShocked
            count: 2
        vp_amount: 3
        description: "Score 3VP instead for 2 NML objectives controlled with non-Battle-shocked CHARACTERs."
    max_vp: 12

  # ── Skull Takers (optional) ─────────────────────────────────────────────────
  - name: "Skull Takers"
    description: >-
      At the end of the Fight phase, for each CHARACTER model from your army, if
      that model destroyed one or more enemy units that phase, you score 3VP.
    is_default: false
    scoring:
      - timing:
          phase: Fight
          whose_turn: Either
          from_round: 1
        condition:
          All:
            - IsCharacter
            - DestroyedEnemyUnitThisPhase
        vp_amount: 3
        description: "Score 3VP for each CHARACTER that destroyed one or more enemy units this Fight phase."
    max_vp: 12
