# World Eaters: Frenzied Reavers
# Combat Patrol Faction Data
# Source: Frenzied_Reavers.md

id: 2
name: "Frenzied Reavers"

# Faction keywords: CHAOS, KHORNE, WORLD_EATERS
# (1 << 16) | (1 << 17) | (1 << 19) = 65536 + 131072 + 524288 = 720896
faction_keywords: 720896

# ─── Faction Ability: Blessings of Khorne ──────────────────────────────────────
faction_ability:
  name: "Blessings of Khorne"
  description: >-
    At the start of each battle round, roll 5D6. Allocate dice to activate up
    to two Blessings. Each Blessing can only be activated once per round. Active
    Blessings apply to all units with this ability until the end of the battle round.
  ability_type: FactionAbility
  effects:
    - DicePoolAllocation:
        num_dice: 5
        max_blessings: 2
        blessings:
          - name: "Rage-fuelled Invigoration"
            requirement: DoubleTwoPlus
            effects:
              - TriggerMoveReaction:
                  move_type: PileInAndConsolidation
                  distance:
                    Fixed: 6000
            description: >-
              Each time a model in this unit makes a Pile-in or Consolidation
              move, it can move up to 6" instead of up to 3".
          - name: "Total Carnage"
            requirement: DoubleTwoPlus
            effects:
              - FightOnDeath:
                  threshold: 4
                  modifier_source: null
            description: >-
              Each time a model in this unit is destroyed by a melee attack, if
              it has not fought this phase, roll one D6: on a 4+, do not remove
              it from play. The destroyed model can fight after the attacking
              unit has finished making its attacks, and is then removed from play.
          - name: "Martial Excellence"
            requirement: DoubleFourPlusOrTripleAny
            effects:
              - GrantWeaponAbility:
                  weapon_ability:
                    SustainedHits: 1
                  weapon_filter: MeleeOnly
            description: >-
              Melee weapons equipped by models in this unit have the
              [SUSTAINED HITS 1] ability.
  trigger: StartOfBattleRound

