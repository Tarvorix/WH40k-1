[package]
name = "wh40k_wasm_api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wh40k_core_types = { workspace = true }
wh40k_dice = { workspace = true }
wh40k_geometry = { workspace = true }
wh40k_game_core = { workspace = true }
wh40k_command_system = { workspace = true }
wh40k_event_system = { workspace = true }
wh40k_replay = { workspace = true }
wh40k_search_core = { workspace = true }
wh40k_search_abstraction = { workspace = true }
wh40k_eval_heuristic = { workspace = true }
wh40k_eval_features = { workspace = true }
wh40k_stratagem_runtime = { workspace = true }
wh40k_boarding_content = { workspace = true }
wh40k_boarding_rules = { workspace = true }
